<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">{{ vm.mode === 'login' ? 'Welcome back' : 'Create your account' }}</h1>
        <p class="text-muted small mb-4">Every new account starts with $100,000 in simulated cash.</p>
        <form ng-submit="vm.submit()" novalidate>
          <div class="mb-3">
            <label class="form-label" for="u">Username</label>
            <input id="u" class="form-control" ng-model="vm.form.username" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="p">Password</label>
            <input id="p" type="password" class="form-control" ng-model="vm.form.password"
                   autocomplete="{{ vm.mode === 'login' ? 'current-password' : 'new-password' }}" required>
            <div class="form-text" ng-if="vm.mode === 'register'">At least 8 characters.</div>
          </div>
          <div class="alert alert-danger py-2 small" ng-if="vm.error">
            {{ vm.error }}
            <ul class="mb-0" ng-if="vm.details"><li ng-repeat="d in vm.details">{{ d.field }}: {{ d.message }}</li></ul>
          </div>
          <button class="btn btn-primary w-100" ng-disabled="vm.busy">
            {{ vm.mode === 'login' ? 'Log in' : 'Sign up' }}
          </button>
        </form>
        <div class="text-center mt-3 small">
          <a href="" ng-click="vm.mode = vm.mode === 'login' ? 'register' : 'login'; vm.error = null">
            {{ vm.mode === 'login' ? "New here? Create an account" : 'Have an account? Log in' }}
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
